[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akse-research"
version = "0.1.0"
description = "Paper-guided reference implementation of Abductive Knowledge Self-Evolution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
models = ["torch>=2.2,<3", "transformers>=4.44,<5", "accelerate>=0.33,<2", "sentence-transformers>=3,<6", "sentencepiece>=0.2,<1"]
metrics = ["bert-score>=0.3.13,<0.4"]
plots = ["matplotlib>=3.8,<4", "numpy>=1.26,<3", "pandas>=2.2,<3"]

[project.scripts]
akse = "akse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["akse*"]
